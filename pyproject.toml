[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-runner"
version = "0.1.34"
description = "Run Claude Code and Codex agents on Mesh tasks: parallel sessions per agent, isolated worktrees, resumable waits."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mesh-runner = "mesh_runner.cli:main"
mesh-runner-guarded-launch = "mesh_runner.launch_guard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mesh_runner = ["editor_bundle/*.json", "qa_assignment_v1/*"]
